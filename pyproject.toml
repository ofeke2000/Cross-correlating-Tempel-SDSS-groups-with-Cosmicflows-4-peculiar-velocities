[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvcorr"
version = "0.1.0"
description = "Density-velocity cross-correlation dipole estimator: Tempel SDSS groups x Cosmicflows-4 peculiar velocities (MDPL2 simulation-validation arm)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "healpy",
    "astropy",
    "matplotlib",
    "h5py",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
